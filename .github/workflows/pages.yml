name: Publish component lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the component lab
        uses: actions/checkout@v4
      - name: Validate the one-button lesson
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const home = fs.readFileSync('index.html', 'utf8');
          assert.equal(home, fs.readFileSync('button-guide.html', 'utf8'));
          assert.equal((home.match(/<textarea\b/g) || []).length, 1);
          assert.ok(!home.includes('id="examples"'));
          const starter = fs.readFileSync('button.html', 'utf8');
          assert.equal(starter.split('\n').length, 10);
          assert.ok(!starter.includes('<style>'));
          console.log('One short button example with matching home and guide pages.');
          NODE
      - name: Install guide browser test tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test the annotated Buttons guide
        run: node tests/button-guide.cjs
      - name: Save guide screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buttons-guide-review
          path: test-results/
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html button-guide.html button.html _site/
          cp test-results/button-guide-desktop.png test-results/button-guide-mobile.png _site/
          cp -R buttons _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$PAGE_URL" -o /tmp/component-lab-live.html
          grep -Fq 'One button. Five ways to change it.' /tmp/component-lab-live.html
          for file in index.html button-guide.html button.html; do
            curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors --max-time 30 "${PAGE_URL%/}/$file" -o /tmp/component-example-live.html
            cmp "$file" /tmp/component-example-live.html
          done
          echo "Published one-button lesson and starter verified at $PAGE_URL"
